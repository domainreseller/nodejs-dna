# Publishes the package to npm when a GitHub release is created.
#
# Uses npm trusted publishing (OIDC), so no npm token is stored in this repo.
# One-time setup on npmjs.com: nodejs-dna -> Settings -> Trusted Publisher ->
# GitHub Actions, organization "domainreseller", repository "nodejs-dna",
# workflow "npm-publish.yml". Then set the repository variable
# NPM_TRUSTED_PUBLISHING to true.
#
# Until that variable is true the publish job only prints a notice and
# succeeds, so a release never shows a red run while npm is still published
# by hand.

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:unit
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the publishing setup
        id: creds
        run: |
          if [ "${{ vars.NPM_TRUSTED_PUBLISHING }}" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::npm trusted publishing is not set up yet (NPM_TRUSTED_PUBLISHING variable), skipping the publish."
          fi
      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # Trusted publishing needs npm 11.5.1 or newer.
      - if: steps.creds.outputs.ready == 'true'
        run: npm install -g npm@latest
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - name: Skip when this version is already on npm
        if: steps.creds.outputs.ready == 'true'
        id: check
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "nodejs-dna@$v" version >/dev/null 2>&1; then
            echo "nodejs-dna@$v is already published, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public
